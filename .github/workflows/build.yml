name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq android-sdk-platform-23 aapt apksigner dalvik-exchange zipalign libandroid-json-java
      - name: Run tests
        run: tests/run.sh
      - name: Build APK
        # CI builds are signed with a throwaway key, so they install fresh rather than as an update.
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ES-DE-Art-Grabber-apk
          path: ES-DE-Art-Grabber.apk
